name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mongodb://localhost:27017/igire?replicaSet=rs0&directConnection=true
      AUTH_SECRET: ci-secret-not-used-in-prod
      RESEND_API_KEY: re_ci_stub
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Prisma's MongoDB connector requires a replica set. This action starts a
      # single-node replica set (rs0) on localhost:27017.
      - name: Start MongoDB (replica set)
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Push schema to MongoDB
        run: npx prisma db push --skip-generate

      - name: Create partial unique indexes
        run: npm run db:indexes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
